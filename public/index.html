<!-- ONLINE COUNTER -->

<div class="online-counter">
  🟢 Users online:
  <span id="online">0</span>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
function getUserId() {

  let id =
    localStorage.getItem("saks-user-id");

  if (!id) {

    id = crypto.randomUUID();

    localStorage.setItem(
      "saks-user-id",
      id
    );

  }

  return id;
}

window.addEventListener(
  "DOMContentLoaded",
  () => {

    if (typeof io === "undefined") {
      console.error(
        "Socket.IO failed to load"
      );

      return;
    }

    const socket = io({
      auth: {
        userId: getUserId()
      }
    });

    socket.on(
      "connect",
      () => {

        console.log(
          "Connected to socket server"
        );

      }
    );

    socket.on(
      "onlineUsers",
      (count) => {

        const online =
          document.getElementById(
            "online"
          );

        if (online) {
          online.innerText =
            count;
        }

      }
    );

  }
);
</script>
<!-- particles background -->
<div id="particles-js"></div>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

<script>
tsParticles.load("particles-js", {
  fullScreen: {
    enable: false
  },

  background: {
    color: {
      value: "transparent"
    }
  },

  fpsLimit: 60,

  particles: {
    number: {
      value: 80
    },

    color: {
      value: "#ffffff"
    },

    links: {
      enable: true,
      color: "#ffffff",
      distance: 150,
      opacity: 0.15,
      width: 1
    },

    move: {
      enable: true,
      speed: 1
    },

    opacity: {
      value: 0.4
    },

    size: {
      value: {
        min: 1,
        max: 3
      }
    }
  },

  interactivity: {
    events: {
      onHover: {
        enable: true,
        mode: "grab"
      }
    },

    modes: {
      grab: {
        distance: 140,
        links: {
          opacity: 0.4
        }
      }
    }
  }
});
</script>
